name: Deploy the hosted server

# The hosted MCP server (hosted/wrangler.jsonc) and the website (hosted/wrangler.site.jsonc) go live
# with each change to main that reaches their bundles, in this one job: the MCP server first, then
# the website. The website binds the MCP server's Durable Object (hosted/src/state.ts), which runs
# the code the MCP server last deployed, so deploying the MCP server first keeps the website's code
# from running ahead of the object's. A release is such a change too: the version commit changes
# package.json, whose version both bundles carry. A maintainer can run this by hand on main to
# deploy again, or on a release tag from v0.13.0 on to roll both back.
#
# A run deploys the commit it runs on, and nothing else: the environment's rule for main and v*
# checks the ref a run is for, so an input naming other code would take the Cloudflare token
# past it. The first step checks that ref as well, in case the rule is missing.
on:
  push:
    branches:
      - main
    # What the two bundles are built from. A change elsewhere (tests, docs) leaves them as they are.
    paths:
      - "src/**"
      - "hosted/**"
      - "!hosted/test/**"
      - "!hosted/**/*.md"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - ".github/workflows/deploy-hosted.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare
    if: github.repository == 'rivi-software/agentic-seo-check'
    runs-on: ubuntu-24.04
    # The Cloudflare API token lives in this environment's secrets, so only this job sees it.
    environment:
      name: hosted
      url: https://mcp.agentic-seo.rivi.software/
    # A push while a deploy runs waits for it. Of the pushes waiting, only the newest deploys: it
    # carries the others' changes.
    concurrency:
      group: deploy-hosted
      cancel-in-progress: false
    steps:
      - name: Only main or a release tag
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" != refs/heads/main && "$REF" != refs/tags/v[0-9]* ]]; then
            echo "::error::The hosted server deploys from main or a release tag (v0.13.0), not from $REF."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit the run is for: the push's, or main's or the tag's.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check, build and test the Workers
        run: pnpm run hosted:verify

      - name: Deploy the MCP server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run hosted:deploy

      # Straight after the MCP server's, whose Durable Object the website binds: a website deploy
      # never goes out when the MCP server's failed. Until it is done, the website's previous code
      # calls the new object, which is why the object's methods stay additive.
      - name: Deploy the website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run site:deploy
