name: Deploy the hosted server

# The hosted MCP server (hosted/) runs the latest npm release: the release workflow calls this once
# it has published one. A maintainer can run it by hand too, on a release tag to roll back, or on
# main to apply a change to hosted/wrangler.jsonc (a limit, MODE) before the next release.
#
# A run deploys the commit it runs on, and nothing else: the environment's rule for main and v*
# checks the ref a run is for, so an input naming other code would take the Cloudflare token
# past it. The first step checks that ref as well, in case the rule is missing.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Cloudflare
    if: github.repository == 'rivi-software/agentic-seo-check'
    runs-on: ubuntu-24.04
    # The Cloudflare API token lives in this environment's secrets, so only this job sees it.
    environment:
      name: hosted
      url: https://mcp.agentic-seo.rivi.software/
    concurrency:
      group: deploy-hosted
      cancel-in-progress: false
    steps:
      - name: Only main or a release tag
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" != refs/heads/main && "$REF" != refs/tags/v[0-9]* ]]; then
            echo "::error::The hosted server deploys from main or a release tag (v0.7.0), not from $REF."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit the run is for: the one the release workflow published, or main's or the tag's.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check, build and test the Worker
        run: pnpm run hosted:verify

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run hosted:deploy
