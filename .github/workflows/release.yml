name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Version or publish
    if: github.repository == 'rivi-software/agentic-seo-check'
    # npm trusted publishing needs a GitHub-hosted runner.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          # No registry-url: setup-node would write an .npmrc with a placeholder token, which pnpm
          # would send instead of using trusted publishing.

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm run verify

      # RIVI Bot, not github-actions, writes the version commit, the "Version packages" pull
      # request, the tag and the GitHub release, through the GitHub API (push-with-git-cli: false
      # below), so its commits are signed and authored by the App, and CI starts on its pushes by
      # itself. The App's client ID is written here rather than read from a variable: it is public.
      # Minted after Verify, so the hour-long token outlasts the publish.
      - name: Mint the RIVI Bot token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: Iv23liRHyPMObYUqpcm3 # RIVI Bot
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write # the version commit, the tag and the GitHub release
          permission-pull-requests: write # the "Version packages" pull request

      - name: Open the version pull request or publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run version-packages
          publish-script: pnpm run release
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          github-token: ${{ steps.app-token.outputs.token }}
          # The default in v2, set so a bump that changes it does not move commits to the git CLI.
          push-with-git-cli: false

  # The hosted MCP server runs the release just published, and the website deploys again after it:
  # a job of its own, whose environment holds the Cloudflare token, so the publish job never sees it.
  deploy-hosted:
    name: Deploy the hosted server
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-hosted.yml
    # A called workflow sees only the secrets its caller hands it, and that holds for the secrets of
    # its own job's environment too: without this, the hosted environment's CLOUDFLARE_API_TOKEN
    # reaches the deploy step empty, while the environment's variables come through.
    secrets: inherit
