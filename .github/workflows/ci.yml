name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify on Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The package supports Node 22.19 and later, until 22's end of life on 2027-04-30; then the
        # floor moves to 24 (here, in `engines` and in @types/node). .node-version is the one we
        # develop on.
        node: ["22", "24", "26"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run check

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Check the packed package
        run: pnpm run check:package

  # The hosted MCP server (hosted/): typechecked, bundled the way a deploy bundles it, so a
  # Node-only import fails here rather than in the deploy, and tested in workerd.
  hosted:
    name: Hosted server
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run hosted:check

      - name: Build the Worker
        run: pnpm run hosted:build

      - name: Test in workerd
        run: pnpm run hosted:test

  # The check the main ruleset requires (.github/rulesets/main.json). It passes only when every
  # Node version above and the hosted server passed, so the jobs can change without changing the
  # ruleset. It runs even when one of them failed: a skipped check would count as passing.
  verified:
    name: verify
    if: always()
    needs: [verify, hosted]
    runs-on: ubuntu-24.04
    steps:
      - name: Every Node version and the hosted server passed
        env:
          VERIFY: ${{ needs.verify.result }}
          HOSTED: ${{ needs.hosted.result }}
        run: |
          echo "The Node versions together: $VERIFY; the hosted server: $HOSTED"
          test "$VERIFY" = success && test "$HOSTED" = success
