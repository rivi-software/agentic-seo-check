version: 2
updates:
  # Depot CI's workflows are in /.depot/workflows (issue #127); one group bumps an action in both.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.depot/workflows
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]

  # A bump of a runtime dependency's or a peer's range needs a changeset before it releases.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # @types/node follows the oldest Node the package supports (22), so type-checking catches an
      # API that Node 22 lacks; its next major comes with raising that floor.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      development:
        dependency-type: development
      production:
        dependency-type: production
