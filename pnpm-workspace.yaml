# Dependency build scripts are blocked unless listed here (pnpm 12).
allowBuilds:
  # tsx and vitest take esbuild's binary from an optional platform package; its script only checks it.
  esbuild: true
  # lefthook's postinstall runs `lefthook install`, which writes the pre-commit hook of lefthook.yml into .git/hooks
  # (it skips that where CI is set).
  lefthook: true
  # Wrangler runs the hosted server locally in workerd, whose binary comes from an optional platform package; its
  # script only checks it, as esbuild's does.
  workerd: true
  # posthog-js (the website's analytics, bundled into the hosted Worker) depends on core-js, whose postinstall only
  # prints a request for donations.
  core-js: false

# No transitive dependencies from git or tarball URLs.
blockExoticSubdeps: true
